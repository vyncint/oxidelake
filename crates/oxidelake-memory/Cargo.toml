[package]
name = "oxidelake-memory"
description = "OxideLake memory management: aligned host buffers, pinned/UMA allocators, three-tier spill manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["cuda"]

[features]
default = []
cuda = ["dep:cudarc"]
metal = ["dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]

[dependencies]
oxidelake-core.workspace = true
arrow.workspace = true
object_store.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
cudarc = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
