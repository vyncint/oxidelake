[package]
name = "oxidelake-storage"
description = "OxideLake storage: Parquet writer/pruning configuration, Arrow IPC spill files, object-store IO (io_uring optional)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxidelake-storage"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["io-uring"]

[features]
# `datagen` is the demo-table generator behind `oxide gen-data`. It is on by
# default so the binaries and the test suites get it without asking, and it is
# a feature so a library consumer can leave the demo data out of their build
# -- `oxidelake-api` does (#41).
default = ["datagen"]
datagen = []
io-uring = ["dep:io-uring", "dep:async-trait"]

[dependencies]
oxidelake-core.workspace = true
oxidelake-memory.workspace = true
arrow.workspace = true
parquet.workspace = true
object_store.workspace = true
datafusion.workspace = true
tokio.workspace = true
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
async-trait = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# The io_uring signal test installs a SIGUSR1 handler without SA_RESTART, so
# `submit_and_wait` really returns EINTR (#27). Dev-only.
libc.workspace = true
