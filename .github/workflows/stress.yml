# Flake hunter for the PTY suite: the dashboard tests, many times, on both
# OSes, at several concurrency levels. A flaky harness teaches contributors to
# re-run CI rather than read it. Run before a release and whenever anything
# touching frames, waits or the event loop changes.
name: stress

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per OS, split across thread counts 1, 4 and 16
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-stress-release
          cache-bin: false
          cache-workspace-crates: false
      - name: Build once and exercise every thread count
        env:
          ITERS: ${{ inputs.iterations || '100' }}
          # The whole point of this workflow is the one iteration in a hundred
          # that fails, and a screen in a 45-minute log is the hardest place
          # to read one. Every screen a failing wait carries is written here
          # for the report step below (termlens 0.10).
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
        run: make stress-tui
      - uses: vyncint/termlens/.github/actions/report@3926896a407c6c444afb971296337135de94c650 # v0.11.6
        if: failure()
        with:
          name: termlens-report-stress-${{ matrix.os }}
      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-stress-${{ matrix.os }}
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore
