# Flake hunter for the PTY suite: the dashboard tests, many times, on both
# OSes, at several concurrency levels. A flaky harness teaches contributors to
# re-run CI rather than read it. Run before a release and whenever anything
# touching frames, waits or the event loop changes.
name: stress

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per OS, split across thread counts 1, 4 and 16
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-stress-release
          cache-bin: false
          cache-workspace-crates: false
      - name: Build once and exercise every thread count
        env:
          ITERS: ${{ inputs.iterations || '100' }}
        run: make stress-tui
      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-stress-${{ matrix.os }}
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore
