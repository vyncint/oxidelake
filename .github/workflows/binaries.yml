# Prebuilt binaries for every release, so that running an `oxide` cluster does
# not require a Rust toolchain on every node.
#
# Separate from release.yml on purpose: publishing to crates.io happens once
# and cannot be repeated, while building an artifact can fail for reasons that
# have nothing to do with the release. This workflow is re-runnable against
# any existing tag and only ever fills in assets that are missing.
#
# Linux targets are musl, so the binaries are statically linked and run on any
# distribution regardless of its glibc. Windows is out of scope (docs/roadmap.md).
name: binaries

on:
  workflow_call:
    inputs:
      tag:
        description: the release tag to build binaries for, e.g. v0.1.0
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: >-
          PAT with contents:write on vyncint/homebrew-tap. Named rather than
          inherited: a called workflow with `secrets: inherit` gets every
          secret this repository has, and this one needs exactly one. Absent
          is fine — the formula job says so and the tap keeps what it has.
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: the release tag to build binaries for, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from Apple silicon: the Xcode SDK is universal, so an
          # arm64 Mac produces an x86-64 binary with only `rustup target add`.
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      # A re-run against an existing tag (docs/RELEASING.md) must not rebuild
      # what is already published: an archive is immutable once uploaded, and
      # a macOS build of this graph is measured in hours.
      - name: Already on the release?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="oxidelake-${TAG#v}-${TARGET}.tar.gz"
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if printf '%s\n' "$assets" | grep -qxF "$archive"; then
            echo "$archive is already attached to $TAG — nothing to build"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Add the target's standard library
        if: steps.published.outputs.present != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: musl linker (Linux)
        if: steps.published.outputs.present != 'true' && contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      # One binary per invocation, on purpose. The release profile is fat LTO
      # with a single codegen unit, so linking a binary is a whole-program LLVM
      # pass over Arrow, DataFusion and Ballista. Cargo schedules the three
      # binaries' links in parallel, and three of those do not fit in a 16 GB
      # Linux runner that has no swap: the VM is torn down and the job ends
      # with "The runner has received a shutdown signal", exit 143, at exactly
      # this point — v0.1.0 (both musl targets) and v0.1.2 (aarch64 musl).
      # macOS survives only by swapping, which is where its hours go. The
      # dependencies still compile in parallel during the first invocation;
      # the second and third only link.
      - name: Build
        if: steps.published.outputs.present != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for binary in oxide oxide-scheduler oxide-worker; do
            cargo build --release --locked -p oxidelake-runtime --bin "$binary" --target "$TARGET"
          done
      - name: Package
        if: steps.published.outputs.present != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="oxidelake-${version}-${TARGET}"
          mkdir "$stage"
          for binary in oxide oxide-scheduler oxide-worker; do
            cp "target/${TARGET}/release/${binary}" "$stage/"
          done
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          archive="${stage}.tar.gz"
          sums() { if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          sums "$archive" > "${archive}.sha256"
          # A second copy without the version, so `releases/latest/download/…`
          # is a URL that stays valid across releases.
          alias="${archive/-${version}-/-}"
          cp "$archive" "$alias"
          sums "$alias" > "${alias}.sha256"
          # Ask the file what it is: a cross-build that is quietly the host's
          # architecture would pass every other check here.
          case "$TARGET" in
            x86_64-*)  want="x86" ;;
            aarch64-*) want="arm64|aarch64|ARM aarch64" ;;
          esac
          got=$(file -b "target/${TARGET}/release/oxide")
          if ! printf '%s' "$got" | grep -qE "$want"; then
            echo "::error::built for $TARGET but the binary is: $got"; exit 1
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "ALIAS=$alias" >> "$GITHUB_ENV"
      # Uploaded only if absent, never clobbered: a published archive is
      # immutable, and rebuilding a tag yields a different checksum.
      - name: Attach to the release
        if: steps.published.outputs.present != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for file in "$ARCHIVE" "${ARCHIVE}.sha256" "$ALIAS" "${ALIAS}.sha256"; do
            if printf '%s\n' "$published" | grep -qxF "$file"; then
              echo "already published, left alone: $file"
            else
              gh release upload "$TAG" "$file"; echo "uploaded: $file"
            fi
          done

  # Regenerate the Homebrew formula from the archives just uploaded, the way
  # mossaic's release does: generated rather than hand-edited, because a
  # hand-edit in the tap is overwritten by the next release, silently. The
  # checksums come from the `.sha256` files the matrix produced, so the
  # formula cannot describe an archive that was never built.
  #
  # Best-effort: it needs a token with write access to the tap, and without
  # one it says so and exits clean — a formula one version behind is a smaller
  # problem than a release that fails after the crates are on crates.io.
  formula:
    name: homebrew formula
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The token is checked before anything uses it, and reported on without
      # being revealed: its kind (a published prefix, not entropy) and length.
      # A value pasted with a trailing newline looks normal in the secrets UI
      # and fails at first use with a message about URLs.
      - name: Check the token is usable
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the tap keeps its current formula"
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TOKEN" in
            github_pat_*) kind="fine-grained PAT" ;;
            ghp_*)        kind="classic PAT" ;;
            gho_*|ghu_*|ghs_*|ghr_*) kind="a GitHub token, but not a PAT" ;;
            *)            kind="UNRECOGNISED - no GitHub token prefix" ;;
          esac
          trimmed="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          echo "looks like: $kind"
          echo "length: ${#TOKEN} (${#trimmed} once whitespace is removed)"
          if [ "${#trimmed}" -ne "${#TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN carries whitespace. Using the trimmed value; worth setting it again cleanly."
          fi
          case "$trimmed" in
            *[!A-Za-z0-9_]*)
              echo "::error::HOMEBREW_TAP_TOKEN does not look like a GitHub token: $kind, ${#trimmed} characters, holding characters a token cannot. Re-set it with: gh secret set HOMEBREW_TAP_TOKEN --repo vyncint/oxidelake"
              exit 1
              ;;
          esac
          echo "::add-mask::$trimmed"
          echo "token=$trimmed" >> "$GITHUB_OUTPUT"
          echo "usable=true" >> "$GITHUB_OUTPUT"

      # Checkout does the authentication rather than the token being spliced
      # into a remote URL by hand. The credential is scoped to one repository
      # and pushing back is this job's whole business.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.usable == 'true'
        with:
          repository: vyncint/homebrew-tap
          token: ${{ steps.token.outputs.token }}
          path: tap
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Generate and push
        if: steps.token.outputs.usable == 'true'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/vyncint/oxidelake/releases/download/${TAG}"

          # One checksum per platform the formula serves. Windows has no
          # Homebrew, and this project has no Windows build anyway.
          declare -A sums
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            url="${base}/oxidelake-${version}-${target}.tar.gz.sha256"
            sum="$(curl -fsSL "$url" | awk '{print $1}')"
            if [ -z "$sum" ]; then
              echo "::error::no checksum for ${target}; the archive did not upload"
              exit 1
            fi
            sums[$target]="$sum"
          done

          block() {
            printf '      url "%s/oxidelake-%s-%s.tar.gz"\n      sha256 "%s"\n' \
              "$base" "$version" "$1" "${sums[$1]}"
          }

          mkdir -p tap/Formula
          {
            echo "# This file is generated by oxidelake's release workflow. DO NOT EDIT."
            echo "# https://github.com/vyncint/oxidelake/blob/main/.github/workflows/binaries.yml"
            echo "class Oxidelake < Formula"
            echo '  desc "GPU-accelerated analytical engine on DataFusion and Ballista: SQL and vector search over Parquet"'
            echo '  homepage "https://github.com/vyncint/oxidelake"'
            echo '  license "Apache-2.0"'
            echo
            echo "  livecheck do"
            echo '    skip "Auto-generated on release."'
            echo "  end"
            echo
            echo "  on_macos do"
            echo "    on_arm do";   block aarch64-apple-darwin;  echo "    end"
            echo "    on_intel do"; block x86_64-apple-darwin;   echo "    end"
            echo "  end"
            echo
            echo "  on_linux do"
            echo "    on_arm do";   block aarch64-unknown-linux-musl; echo "    end"
            echo "    on_intel do"; block x86_64-unknown-linux-musl;  echo "    end"
            echo "  end"
            echo
            echo "  def install"
            echo '    bin.install "oxide", "oxide-scheduler", "oxide-worker"'
            echo '    doc.install "README.md", "CHANGELOG.md"'
            echo "  end"
            echo
            echo "  test do"
            echo '    assert_match version.to_s, shell_output("#{bin}/oxide --version")'
            echo "    # Generate a table and query it: the embedded engine works with no"
            echo "    # cluster, no network and no GPU."
            echo '    system bin/"oxide", "gen-data", "--rows", "100", "--out", testpath/"data"'
            echo '    out = shell_output("#{bin}/oxide sql -q \"SELECT count(*) AS n FROM t\" --table t=#{testpath}/data")'
            echo '    assert_match "100", out'
            echo "  end"
            echo "end"
          } > tap/Formula/oxidelake.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/oxidelake.rb
          if git diff --cached --quiet; then
            echo "the formula already describes ${TAG}"
            exit 0
          fi
          git commit -q -s -m "chore: oxidelake ${version}"
          git push -q origin HEAD:main
          echo "tap updated to ${version}"
