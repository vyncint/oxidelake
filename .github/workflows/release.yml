# Release pipeline, triggered by pushing a v*.*.* tag.
# The human-side checklist lives in docs/RELEASING.md.
#
# Nine crates publish in dependency order through crates.io Trusted Publishing
# (GitHub OIDC), from a `release` environment that deploys from v* tags alone,
# so no registry credential exists on the repository. The publish loop is
# resumable: versions already on the registry are skipped, so a rate-limited
# run can be finished later with `workflow_dispatch`.
name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to resume (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

# Never cancel a release mid-publish; a duplicate tag push queues instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Compare the tag against the workspace version
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oxidelake-core") | .version')"
          echo "tag=${tag} workspace=${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match the workspace version ${version}. Bump it (docs/RELEASING.md) before tagging."
            exit 1
          fi
      # Before `cargo publish`, which is the irreversible step: a tag whose
      # CHANGELOG section is present and empty must fail here, not after the
      # crates are permanently on the registry.
      - name: The CHANGELOG has notes for this version
        run: .github/scripts/extract-changelog.sh "$TAG" > /dev/null

  # Re-run the exact CI gates on the tagged tree.
  ci:
    name: ci
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  # Breaking changes need a minor bump pre-1.0. Skipped gracefully on the first
  # release, when there is no published baseline to compare against.
  semver:
    name: cargo-semver-checks
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Look for a published baseline on crates.io
        id: published
        env:
          REPO: ${{ github.repository }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -A "oxidelake-release (github.com/${REPO})" https://crates.io/api/v1/crates/oxidelake-core)"
          echo "crates.io responded ${status}"
          echo "found=$([ "$status" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip (first release, no baseline)
        if: steps.published.outputs.found != 'true'
        run: echo "oxidelake-core is not on crates.io yet; skipping semver checks gracefully."
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        if: steps.published.outputs.found == 'true'
        with:
          package: oxidelake-core,oxidelake-memory,oxidelake-device,oxidelake-compute,oxidelake-storage,oxidelake-planner,oxidelake-tui,oxidelake-runtime,oxidelake-api

  publish:
    name: publish to crates.io (ordered, resumable)
    needs: [ci, semver]
    runs-on: ubuntu-latest
    # The `release` environment only deploys from v* tags, so an OIDC publish
    # token can never be minted from a branch.
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Verify the tree the tag points at
        run: cargo check --workspace --all-targets --locked
      # The action exchanges this job's OIDC token for a publish token that
      # lives for minutes. Trusted Publishing is configured per crate, so it
      # cannot CREATE a crate: the very first publish of each crate uses the
      # maintainer's temporary token (docs/RELEASING.md), which is then deleted.
      # Until at least one crate has a Trusted Publishing config, crates.io
      # answers the exchange with 400 "No Trusted Publishing config found" —
      # that is expected on the first release, so the step may fail and the
      # publish loop falls back to the registry token below.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        continue-on-error: true
      - name: Publish every crate, in dependency order
        env:
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          NEW_CRATE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ua="oxidelake-release (github.com/${GITHUB_REPOSITORY})"
          # Dependency order, leaves first. core has no internal deps; memory
          # needs core; device needs memory; compute needs device; storage
          # needs memory; planner needs compute; tui needs core; runtime needs
          # planner, storage and tui; api needs runtime.
          crates="oxidelake-core oxidelake-memory oxidelake-device oxidelake-compute oxidelake-storage oxidelake-planner oxidelake-tui oxidelake-runtime oxidelake-api"
          # crates.io throttles NEW-crate creation hard: a short burst, then one
          # every ten minutes. Reacting to the 429 costs a ten-minute wait per
          # crate; pacing proactively is cheaper. Existing crates are not
          # throttled the same way, so the pause applies only to first publishes.
          NEW_CRATE_PAUSE="${NEW_CRATE_PAUSE:-180}"
          published_new=0
          for crate in $crates; do
            if curl -sf -A "$ua" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io — skipping"
              continue
            fi
            if curl -sf -A "$ua" "https://crates.io/api/v1/crates/$crate" > /dev/null; then
              if [ -n "$OIDC_TOKEN" ]; then
                tok="$OIDC_TOKEN"; echo "$crate exists — Trusted Publishing"
              elif [ -n "$NEW_CRATE_TOKEN" ]; then
                tok="$NEW_CRATE_TOKEN"; echo "$crate exists but no OIDC token was minted — using the registry token"
              else
                echo "::error::$crate exists, no OIDC token was minted and no CARGO_REGISTRY_TOKEN secret is set — configure Trusted Publishing for it (docs/RELEASING.md)"
                exit 1
              fi
            else
              tok="$NEW_CRATE_TOKEN"
              if [ -z "$tok" ]; then
                echo "::error::$crate is a NEW crate and no CARGO_REGISTRY_TOKEN secret is set (docs/RELEASING.md)"
                exit 1
              fi
              if [ "$published_new" -gt 0 ]; then
                echo "$crate is new — pausing ${NEW_CRATE_PAUSE}s before the next first-publish (crates.io new-crate throttle)"
                sleep "$NEW_CRATE_PAUSE"
              fi
              published_new=$((published_new + 1))
              echo "$crate is new — publishing with the temporary token"
            fi
            attempt=1
            while true; do
              echo "publishing $crate $version (attempt $attempt)"
              if out=$(CARGO_REGISTRY_TOKEN="$tok" cargo publish --locked -p "$crate" 2>&1); then
                printf '%s\n' "$out" | tail -2; break
              fi
              printf '%s\n' "$out" | tail -5
              if printf '%s' "$out" | grep -qi "already uploaded"; then
                echo "$crate $version: already uploaded — treating as success"; break
              fi
              if printf '%s' "$out" | grep -qiE "429|too many requests|rate limit"; then
                # Three minutes, not ten: the new-crate throttle admits one per
                # ten minutes after the burst, so a shorter wait just retries a
                # couple of times before it clears — cheaper than sleeping
                # through the whole window when the slot may already be free.
                # Twenty attempts keeps the per-crate budget at an hour.
                if [ "$attempt" -ge 20 ]; then
                  echo "::error::$crate: still rate-limited after $attempt attempts (~1h); resume with workflow_dispatch"; exit 1
                fi
                echo "rate-limited; waiting ${RATE_LIMIT_PAUSE:-180}s before retrying $crate"; sleep "${RATE_LIMIT_PAUSE:-180}"
                attempt=$((attempt + 1)); continue
              fi
              if [ "$tok" = "$OIDC_TOKEN" ] && [ -n "$NEW_CRATE_TOKEN" ] \
                 && printf '%s' "$out" | grep -qiE "403|forbidden|trusted publish"; then
                echo "$crate: OIDC refused — retrying once with the registry token"
                tok="$NEW_CRATE_TOKEN"; attempt=$((attempt + 1)); continue
              fi
              echo "::error::$crate failed to publish for a non-retryable reason"; exit 1
            done
          done

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Extract notes from CHANGELOG.md
        run: .github/scripts/extract-changelog.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

  # Called rather than triggered: a release created with GITHUB_TOKEN raises
  # no event that can start a workflow, so `on: release` never fires.
  binaries:
    name: binaries
    needs: github-release
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: write # upload the archives to the release
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  install:
    name: install
    needs: publish
    uses: ./.github/workflows/install.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
