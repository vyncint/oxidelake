# The quality gate from docs/verification.md, as CI. `make gate` runs the same
# list locally; keep the Makefile, that page and this file in sync.
#
# Job shape follows the other vyncint projects: one job per concern, a single
# `required-green` that branch protection requires, and every action pinned to
# a full commit SHA. Dependency caches accelerate ordinary CI; release calls
# keep a clean full gate. Test execution is never conditional on a cache hit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reused by release.yml so a release re-runs the exact same gates.
  workflow_call:
    inputs:
      clean:
        description: Bypass dependency caches
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      clean:
        description: Run the full gate without dependency caches
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer main tip replaces ordinary CI, but never a caller's release gate.
  cancel-in-progress: ${{ github.workflow == 'CI' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  # Without this the debug target dir (arrow + datafusion + ballista test
  # binaries with full debuginfo) exceeds the hosted runners' free disk and
  # rust-lld dies with SIGBUS mid-link. Debuginfo adds nothing to the gate.
  CARGO_PROFILE_DEV_DEBUG: "false"

jobs:
  changes:
    name: CI policy and changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make ci-scripts
      - name: Classify the actual checkout against its base
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci-policy.py changes >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: make fmt-check

  # Default features are pure CPU (ADR-0006). Every optional capability is a
  # feature, and a feature no job builds is a feature that is already broken —
  # so each one is linted here, on a runner that has none of the hardware.
  clippy:
    name: clippy (${{ matrix.features.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default, target: lint }
          - { name: cuda, target: lint-cuda }
          - { name: predict, target: lint-predict }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell 2>/dev/null || true
      - name: clippy
        env:
          TARGET: ${{ matrix.features.target }}
        # Through the environment, never interpolated into the script:
        # a matrix value is data, and data does not get to be shell.
        run: make "$TARGET"

  test:
    name: test (linux, ${{ matrix.lane.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - { name: default, target: test }
          - { name: io-uring, target: test-io-uring }
          - { name: predict, target: test-predict }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell 2>/dev/null || true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.workflow == 'CI' && !inputs.clean
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-test-${{ matrix.lane.name }}
          cache-bin: false
          cache-workspace-crates: false
      - name: Test the selected feature configuration
        env:
          TARGET: ${{ matrix.lane.target }}
          # Every screen a failing termlens wait carries is also written
          # here, so the `report` step below can put it in the job summary
          # instead of leaving it in a log someone has to scroll. The TUI
          # PTY suite is a flake target (that is what stress.yml is for) and
          # a flake in CI used to leave nothing but scrollback (termlens
          # 0.10).
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
        run: make "$TARGET"
      # `#[ignore]`d so a plain `cargo test` never installs anything behind a
      # contributor's back — these crates are published. CI is where they
      # should run, so CI asks for them by name. The install is the version
      # Cargo.lock names, so the tool and the library are one release.
      - name: termlens-cli against the committed screens
        if: matrix.lane.name == 'default'
        env:
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
        run: make test-termlens-cli
      - name: predict adds no second CUDA stack
        if: matrix.lane.name == 'predict'
        run: make check-predict-no-second-cuda
      - name: cuda feature compiles with no CUDA installed
        if: matrix.lane.name == 'default'
        run: make check-cuda
      - name: dependency chain is coherent
        if: matrix.lane.name == 'default'
        run: make coherence
      # A PTY failure is a picture, and a log is the worst place to read one.
      # This renders every screen the suite left behind — and every insta
      # `.snap.new` — into the job summary, with SVG and HTML uploaded. It
      # installs termlens-cli itself, so nothing else here has to.
      - uses: vyncint/termlens/.github/actions/report@e1b96c8203fd727fa3458af395719c429966ee82 # v0.10.1
        if: failure()
        with:
          name: termlens-report-linux-${{ matrix.lane.name }}
      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-linux-${{ matrix.lane.name }}
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore

  # The Metal lane. Device-independent tests always; the on-device conformance
  # suite only when the runner exposes a Metal device (asked of the Metal API
  # itself, not system_profiler — virtualised runners lie to the latter).
  metal:
    name: metal (macos)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.workflow == 'CI' && !inputs.clean
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-metal
          cache-bin: false
          cache-workspace-crates: false
      - run: make lint-metal
      - name: Metal package tests and macOS PTY suite
        env:
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
        run: make test-metal
      - name: conformance suite on the Metal device
        env:
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
        run: make test-metal-device
      # macOS is the leg where the PTY suite times out first, and the one
      # nobody can reproduce locally on a Linux box.
      - uses: vyncint/termlens/.github/actions/report@e1b96c8203fd727fa3458af395719c429966ee82 # v0.10.1
        if: failure()
        with:
          name: termlens-report-metal
      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-metal
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore

  # The declared rust-version must actually build the workspace against the
  # committed lockfile. This is what makes `rust-version` a verified claim.
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          echo "MSRV: ${msrv}"
          echo "msrv=${msrv}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - run: cargo check --workspace --all-targets --locked

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - run: make doc

  # Supply chain: RustSec advisories, license allow-list, banned crates and
  # registry sources — exactly what `make deny` runs locally (deny.toml).
  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  # The release path's one otherwise-untested script: it turns CHANGELOG.md
  # into release notes, and an empty section must fail before publish.
  release-scripts:
    name: release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./.github/scripts/test-extract-changelog.sh
      # What crates.io will show for every crate: README, repository,
      # keywords, categories, docs.rs link. Inherited fields must be opted
      # into per manifest; 0.1.0 shipped without them.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - run: ./.github/scripts/check-crate-metadata.sh

  # The vendored termlens skill is refreshed by hand, and a stale copy is
  # silent: agents working here get guidance for a version that is no longer
  # the dependency. Nothing can diff it against upstream — the published
  # crate does not ship the skill — but the two versions agreeing is
  # checkable, and that is the drift that happens (`make skill-version`).
  skill-version:
    name: skill version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make skill-version

  # Workflow security audit: unpinned actions, credential persistence,
  # template injection. Accepted findings live in .github/zizmor.yml.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit workflows at pedantic level
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.29.0 --persona=pedantic .github/workflows/

  # Single stable job name for branch protection: require this one check and
  # matrix or job changes never break the required-checks configuration.
  required-green:
    name: required-green
    if: always()
    needs: [changes, fmt, clippy, test, metal, msrv, docs, deny, release-scripts, skill-version, zizmor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-policy.py gate
